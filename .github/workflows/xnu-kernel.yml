# SPDX-License-Identifier: GPL-2.0-only
# The hosted kernel builds: scripts/vm-xnu-build.sh on a new arm64 Ubuntu 24.04 machine, as README step 1 runs it in
# the VM. macOS-DroidVM's toolchain, the k27 tree, xnu-patches applied in order, xnulinux's corecrypto in place of
# XNU's, the kernel compiled with its own flags (warnings are errors) and linked. Nothing else in CI compiles
# xnu-patches. The build fetches what the script fetches (macOS-DroidVM, Apple's open sources and command line
# tools) onto the runner and keeps none of it: no artifact, no cache.
name: xnu-kernel
on:
  push:
    paths:
      - .github/workflows/xnu-kernel.yml
      - xnu-patches/**
      - scripts/vm-xnu-build.sh
      - scripts/vm-xnu-rebuild.sh
  pull_request:
    paths:
      - .github/workflows/xnu-kernel.yml
      - xnu-patches/**
      - scripts/vm-xnu-build.sh
      - scripts/vm-xnu-rebuild.sh
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          uname -srm; nproc; free -g | sed -n 2p; df -h / "$HOME" | sed -n '2,3p'
      - name: scripts/vm-xnu-build.sh
        run: |
          sudo mkdir -p /lib/firmware/xnu   # where the rebuild installs the kernel; a new machine has none
          scripts/vm-xnu-build.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E '^(applied|kernel:|collection:)|kext .* failed' "$RUNNER_TEMP/build.log" || true
          tail -5 "$RUNNER_TEMP/build.log"
      - name: The kernel
        run: |
          python3 - ~/w/dvm/out/k27/kernel-k27.macho /lib/firmware/xnu/kernel.macho xnu-patches <<'PY'
          import glob, struct, sys
          built, installed, patches = sys.argv[1:4]
          d = open(built, 'rb').read()
          magic, cputype, cpusubtype, filetype, ncmds = struct.unpack_from('<IiiII', d, 0)
          assert magic == 0xfeedfacf and cputype == 0x0100000c and filetype == 2, (hex(magic), hex(cputype), filetype)
          assert d == open(installed, 'rb').read(), 'the installed kernel is not the one just built'
          off, segs = 32, []
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', d, off)
              if cmd == 0x19:
                  name = d[off + 8:off + 24].rstrip(b'\0').decode()
                  segs.append((name,) + struct.unpack_from('<QQ', d, off + 24))
              off += size
          for name, vm, size in segs:
              print(f'{name:18} {vm:#x} {size:#x}')
          # every source file the series adds is in the kernel: its name is in the DEVELOPMENT kernel's strings
          added = set()
          for p in sorted(glob.glob(patches + '/*.patch')):
              lines = open(p, errors='replace').read().split('\n')
              for i, l in enumerate(lines):
                  if l.startswith('--- /dev/null') and lines[i + 1].startswith('+++ b/') and lines[i + 1].endswith('.c'):
                      added.add(lines[i + 1][6:].rsplit('/', 1)[1])
          missing = sorted(n for n in added if n.encode() not in d)
          print(f'{len(d)} bytes, {len(segs)} segments; of the {len(added)} C files the series adds, not in the kernel: {missing}')
          PY
